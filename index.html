
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مواعيد | المباريات</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0d101a;color:#f4f5fb;font-family:Arial,sans-serif}
header{background:#121725;padding:20px 15px;position:sticky;top:0;z-index:5;border-bottom:1px solid #252b3c}
.top{display:flex;justify-content:space-between;align-items:center;max-width:1100px;margin:auto}
.logo{font-size:27px;font-weight:bold;color:#35d7bd}
nav{display:flex;gap:8px;overflow:auto;margin-top:18px}
button,select{border:0;border-radius:12px;background:#202638;color:white;padding:12px;cursor:pointer;font-size:14px}
button.active,.tab.active{background:#35d7bd;color:#071b1b}
main{max-width:1000px;margin:20px auto;padding:0 12px}
.section{background:#1c2233;padding:14px 17px;border-radius:15px;margin:22px 0 8px;font-weight:bold;color:#d9deeb}
.match{background:#171c2a;border:1px solid #242b3d;border-radius:17px;margin:10px 0;padding:18px;cursor:pointer}
.match:active{transform:scale(.99)}
.teams{display:grid;grid-template-columns:1fr 100px 1fr;align-items:center;text-align:center;gap:5px}
.team{font-size:16px;font-weight:bold;line-height:1.6}
.team img{width:43px;height:43px;object-fit:contain;display:block;margin:0 auto 8px}
.score{font-size:22px;font-weight:bold}
.time{background:#202638;border-radius:25px;padding:9px 5px;font-weight:bold}
.meta{color:#aeb8ce;font-size:13px;margin-top:14px;display:flex;justify-content:space-between;gap:8px}
#details{display:none}
.back{margin-bottom:15px}
.hero{background:linear-gradient(135deg,#202b42,#151b2b);border-radius:20px;padding:24px 12px;text-align:center}
.heroTeams{display:grid;grid-template-columns:1fr 100px 1fr;align-items:center}
.hero img{width:65px;height:65px;object-fit:contain}
.hero .name{font-weight:bold;margin-top:8px}
.hero .result{font-size:34px;font-weight:bold}
.status{color:#35d7bd;margin-top:12px}
.tabs{display:flex;gap:7px;overflow:auto;margin:17px 0}
.tab{white-space:nowrap;background:#202638;padding:12px 17px;border-radius:12px}
.panel{background:#171d2c;border-radius:16px;padding:16px;min-height:180px}
.panel h3{margin-top:0;color:#35d7bd}
.stat{display:flex;justify-content:space-between;gap:10px;padding:12px 3px;border-bottom:1px solid #30384a}
.pitch{background:repeating-linear-gradient(0deg,#28542d,#28542d 70px,#306335 70px,#306335 140px);border:3px solid #a4c18a;border-radius:12px;padding:20px 8px;min-height:400px;display:flex;flex-direction:column;justify-content:space-around}
.line{display:flex;justify-content:space-around;gap:4px}
.player{text-align:center;font-size:12px;max-width:85px}
.player img{width:43px;height:43px;border-radius:50%;background:#fff;object-fit:cover;display:block;margin:auto}
.player b{display:block;background:#111a;color:white;border-radius:8px;margin-top:5px;padding:3px}
.empty{text-align:center;color:#aeb8ce;padding:35px 10px;line-height:2}
footer{text-align:center;color:#768198;padding:25px}
@media(max-width:450px){.team{font-size:14px}.teams{grid-template-columns:1fr 88px 1fr}.meta{font-size:11px}.heroTeams{grid-template-columns:1fr 85px 1fr}}
</style>
</head>
<body>
<header>
<div class="top">
<div class="logo">مواعيد <small style="font-size:12px;color:#9aa7bc">SPORT</small></div>
<div>⚽ جدول المباريات</div>
</div>
<nav>
<button class="active" onclick="setDay(0,this)">اليوم</button>
<button onclick="setDay(1,this)">غداً</button>
<button onclick="setDay(2,this)">بعد غد</button>
<select id="league" onchange="loadMatches()">
<option value="all">كل البطولات</option>
<option value="eng.1">الدوري الإنجليزي</option>
<option value="esp.1">الدوري الإسباني</option>
<option value="ita.1">الدوري الإيطالي</option>
<option value="ger.1">الدوري الألماني</option>
<option value="fra.1">الدوري الفرنسي</option>
<option value="uefa.champions">دوري أبطال أوروبا</option>
</select>
</nav>
</header>

<main>
<div id="home">
<div id="date" class="section"></div>
<div id="status" class="empty">جارٍ تحميل المباريات...</div>
<div id="matches"></div>
</div>

<div id="details">
<button class="back" onclick="goBack()">← العودة للمباريات</button>
<div id="hero" class="hero"></div>
<div class="tabs">
<button class="tab active" onclick="showTab('info',this)">التفاصيل</button>
<button class="tab" onclick="showTab('stats',this)">الإحصائيات</button>
<button class="tab" onclick="showTab('lineup',this)">التشكيلة</button>
<button class="tab" onclick="showTab('events',this)">الأحداث</button>
</div>
<div id="panel" class="panel"></div>
</div>
</main>
<footer>مواعيد © 2026 - جميع الحقوق محفوظة</footer>

<script>
const leagues=[
{id:"eng.1",name:"الدوري الإنجليزي"},
{id:"esp.1",name:"الدوري الإسباني"},
{id:"ita.1",name:"الدوري الإيطالي"},
{id:"ger.1",name:"الدوري الألماني"},
{id:"fra.1",name:"الدوري الفرنسي"},
{id:"uefa.champions",name:"دوري أبطال أوروبا"}
];
let day=0,events=[],current=null,summary=null;
const $=id=>document.getElementById(id);
function setDay(n,b){
day=n;
document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));
b.classList.add("active");
loadMatches();
}
function dateString(){
let d=new Date();d.setDate(d.getDate()+day);
return d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
}
function clock(date){
return new Date(date).toLocaleTimeString("ar-YE",{hour:"2-digit",minute:"2-digit",timeZone:"Asia/Aden"});
}
function esc(s){
return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
async function loadMatches(){
$("details").style.display="none";$("home").style.display="block";
$("date").textContent="مباريات "+new Date(new Date().setDate(new Date().getDate()+day)).toLocaleDateString("ar-YE");
$("status").textContent="جارٍ جلب المباريات...";
$("matches").innerHTML="";
let selected=$("league").value;
let list=selected==="all"?leagues:leagues.filter(l=>l.id===selected);
let results=await Promise.all(list.map(async l=>{
try{
let r=await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/${l.id}/scoreboard?dates=${dateString()}`);
let j=await r.json();
return (j.events||[]).map(e=>({e,league:l}));
}catch{return []}
}));
events=results.flat();
events.sort((a,b)=>new Date(a.e.date)-new Date(b.e.date));
$("status").textContent=events.length?"عدد المباريات: "+events.length:"لا توجد مباريات متاحة حالياً.";
events.forEach((x,i)=>renderMatch(x,i));
}
function renderMatch(x,i){
let e=x.e,c=e.competitions?.[0],teams=c?.competitors||[];
let h=teams.find(t=>t.homeAway==="home")||teams[0]||{};
let a=teams.find(t=>t.homeAway==="away")||teams[1]||{};
let live=e.status?.type?.state==="in";
let done=e.status?.type?.completed;
let middle=live||done?`${h.score??0} - ${a.score??0}`:clock(e.date);
let div=document.createElement("div");div.className="match";
div.innerHTML=`
<div class="section" style="margin:0 0 14px;padding:8px">${esc(x.league.name)}</div>
<div class="teams">
<div class="team"><img src="${esc(h.team?.logo||"")}" onerror="this.style.display='none'">${esc(h.team?.displayName)}</div>
<div class="score"><div class="time">${middle}</div><small style="color:#35d7bd">${esc(e.status?.type?.shortDetail||"")}</small></div>
<div class="team"><img src="${esc(a.team?.logo||"")}" onerror="this.style.display='none'">${esc(a.team?.displayName)}</div>
</div>
<div class="meta"><span>📺 القناة: غير معلنة</span><span>🎙️ المعلق: غير متوفر</span></div>`;
div.onclick=()=>openMatch(i);$("matches").appendChild(div);
}
async function openMatch(i){
current=events[i];summary=null;
$("home").style.display="none";$("details").style.display="block";
$("hero").innerHTML="جارٍ تحميل تفاصيل المباراة...";
$("panel").innerHTML='<div class="empty">جارٍ تحميل البيانات...</div>';
window.scrollTo(0,0);
let e=current.e,c=e.competitions?.[0],t=c?.competitors||[];
let h=t.find(x=>x.homeAway==="home")||t[0]||{},a=t.find(x=>x.homeAway==="away")||t[1]||{};
$("hero").innerHTML=`<div style="color:#35d7bd">${esc(current.league.name)}</div>
<div class="heroTeams">
<div><img src="${esc(h.team?.logo||"")}"><div class="name">${esc(h.team?.displayName)}</div></div>
<div><div class="result">${h.score??"-"} - ${a.score??"-"}</div><div class="status">${esc(e.status?.type?.detail||clock(e.date))}</div></div>
<div><img src="${esc(a.team?.logo||"")}"><div class="name">${esc(a.team?.displayName)}</div></div>
</div>`;
try{
let r=await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/${current.league.id}/summary?event=${e.id}`);
summary=await r.json();
}catch{}
showTab("info",document.querySelector(".tab"));
}
function goBack(){$("details").style.display="none";$("home").style.display="block";}
function showTab(tab,b){
document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
b.classList.add("active");
let p=$("panel"),e=current.e;
if(tab==="info"){
let c=e.competitions?.[0]||{};
p.innerHTML=`<h3>تفاصيل المباراة</h3>
<div class="stat"><span>البطولة</span><b>${esc(current.league.name)}</b></div>
<div class="stat"><span>التاريخ</span><b>${new Date(e.date).toLocaleDateString("ar-YE")}</b></div>
<div class="stat"><span>التوقيت - اليمن</span><b>${clock(e.date)}</b></div>
<div class="stat"><span>حالة المباراة</span><b>${esc(e.status?.type?.detail||"غير متوفرة")}</b></div>
<div class="stat"><span>الملعب</span><b>${esc(c.venue?.fullName||"غير متوفر")}</b></div>
<div class="stat"><span>القناة الناقلة</span><b>لم تُعلن بعد</b></div>
<div class="stat"><span>المعلق</span><b>غير متوفر حالياً</b></div>`;
}
if(tab==="stats")renderStats(p);
if(tab==="lineup")renderLineup(p);
if(tab==="events")renderEvents(p);
}
function renderStats(p){
let teams=summary?.boxscore?.teams||[];
if(!teams.length){p.innerHTML='<div class="empty">الإحصائيات غير متوفرة لهذه المباراة حالياً.</div>';return;}
let html="<h3>إحصائيات المباراة</h3>";
teams.forEach(team=>{
html+=`<h4>${esc(team.team?.displayName||"الفريق")}</h4>`;
(team.statistics||[]).forEach(s=>{
html+=`<div class="stat"><span>${esc(s.label||s.name)}</span><b>${esc(s.displayValue||s.value)}</b></div>`;
});
});
p.innerHTML=html;
}
function renderLineup(p){
let rosters=summary?.rosters||[];
if(!rosters.length){p.innerHTML='<div class="empty">التشكيلة وصور اللاعبين غير متوفرة من مصدر البيانات لهذه المباراة حالياً.</div>';return;}
let html="<h3>تشكيلة الفريقين</h3>";
rosters.forEach(team=>{
let athletes=team.roster||team.athletes||[];
html+=`<h4>${esc(team.team?.displayName||"الفريق")}</h4>`;
html+='<div class="pitch">';
let starters=athletes.filter(a=>a.starter||a.status?.type?.name==="starter");
if(!starters.length)starters=athletes;
for(let i=0;i<starters.length;i+=4){
html+='<div class="line">';
starters.slice(i,i+4).forEach(a=>{
let name=a.athlete?.displayName||a.displayName||a.fullName||"لاعب";
let img=a.athlete?.headshot?.href||a.headshot?.href||"";
html+=`<div class="player"><img src="${esc(img)}" onerror="this.style.display='none'"><b>${esc(a.athlete?.jersey||a.jersey||"")}</b>${esc(name)}</div>`;
});
html+='</div>';
}
html+='</div>';
});
p.innerHTML=html;
}
function renderEvents(p){
let plays=summary?.commentary||summary?.plays||[];
if(!plays.length){p.innerHTML='<div class="empty">أحداث المباراة غير متوفرة حالياً.</div>';return;}
let html="<h3>أحداث المباراة</h3>";
plays.forEach(x=>{
html+=`<div class="stat"><b>${esc(x.time||x.clock||"")}</b><span>${esc(x.text||x.description||x.headline||"حدث")}</span></div>`;
});
p.innerHTML=html;
}
loadMatches();
setInterval(()=>{if($("details").style.display!=="block")loadMatches();},900000);
</script>
</body>
</html>
